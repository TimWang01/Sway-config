# Titlebar / border palette (sourced by config via include)
# client.<class> takes: <border> <background> <text> <indicator> <child_border>
set $pal-border-bg    #2E3440
set $pal-bg           #3B4252
set $pal-focus-border #4C566A
set $pal-text         #D8DEE9
set $pal-text-bright  #ECEFF4
set $pal-accent       #88C0D0
set $pal-urgent       #BF616A
# Dimmed/deep variants for inactive/unfocused states
set $pal-dim          #353C4A
set $pal-deep         #1F2329
